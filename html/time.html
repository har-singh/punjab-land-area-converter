<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Adder</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 400px;
      width: 100%;
    }

    input, button {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .output {
      margin-top: 1.5rem;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <input type="time" id="timeInput" />
    <button onclick="addTime()">Add 7h 12m</button>
    <div class="output" id="result"></div>
  </div>

  <script>
    function addTime() {
      const input = document.getElementById("timeInput").value;
      if (!input) return;

      const [hours, minutes] = input.split(':').map(Number);
      const date = new Date();
      date.setHours(hours);
      date.setMinutes(minutes);
      date.setSeconds(0);
      date.setMilliseconds(0);

      date.setMinutes(date.getMinutes() + 7 * 60 + 12);
      const hh = String(date.getHours()).padStart(2, '0');
      const mm = String(date.getMinutes()).padStart(2, '0');

      document.getElementById("result").textContent = `New time: ${hh}:${mm}`;
    }
  </script>
</body>
</html>
