<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#87CEEB"/>
  
  <!-- Ground line -->
  <rect x="60" y="385" width="392" height="12" rx="4" fill="#8b4513"/>
  
  <!-- Tractor body -->
  <rect x="120" y="220" width="200" height="90" rx="10" fill="#2e7d32"/>
  
  <!-- Tractor cabin -->
  <rect x="220" y="155" width="85" height="65" rx="5" fill="#4caf50"/>
  
  <!-- Cabin window -->
  <rect x="230" y="165" width="65" height="40" rx="3" fill="#87ceeb"/>
  
  <!-- Engine hood -->
  <rect x="85" y="245" width="55" height="55" rx="5" fill="#1b5e20"/>
  
  <!-- Exhaust pipe -->
  <rect x="100" y="200" width="12" height="50" rx="2" fill="#424242"/>
  <ellipse cx="106" cy="195" rx="8" ry="5" fill="#616161"/>
  
  <!-- Rear large wheel - positioned so bottom touches ground at y=385 -->
  <circle cx="290" cy="310" r="75" fill="#212121"/>
  <circle cx="290" cy="310" r="60" fill="#424242"/>
  <circle cx="290" cy="310" r="25" fill="#ffc107"/>
  
  <!-- Wheel spokes - rear -->
  <rect x="287" y="240" width="6" height="140" fill="#ffc107"/>
  <rect x="220" y="307" width="140" height="6" fill="#ffc107"/>
  
  <!-- Front small wheel - positioned so bottom touches ground at y=385 -->
  <circle cx="115" cy="345" r="40" fill="#212121"/>
  <circle cx="115" cy="345" r="30" fill="#424242"/>
  <circle cx="115" cy="345" r="12" fill="#ffc107"/>
  
  <!-- Steering wheel hint -->
  <circle cx="260" cy="190" r="8" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/>
  
  <!-- Headlight -->
  <ellipse cx="85" cy="270" rx="8" ry="12" fill="#ffeb3b"/>
</svg>
